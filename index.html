<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript API Product Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">PERSONAL JAVASCRIPT PROJECT</p>
      <h1>Product Explorer</h1>
      <p class="subtitle">A simple ecommerce-style product browser built with JavaScript and a REST API.</p>
    </header>

    <section class="controls">
      <input id="searchInput" type="search" placeholder="Search products...">
      <select id="categoryFilter">
        <option value="all">All categories</option>
      </select>
    </section>

    <p id="status" class="status">Loading products...</p>
    <section id="productGrid" class="grid" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
